<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="srv-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1683ff"/>
      <stop offset="100%" stop-color="#20d9ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="rgba(22, 131, 255, 0.1)" stroke="rgba(32, 217, 255, 0.25)" stroke-width="1.5"/>
  <!-- Envelope with letter -->
  <g stroke="url(#srv-grad-3)" stroke-width="2" fill="none">
    <!-- Card emerging -->
    <rect x="28" y="22" width="44" height="28" rx="3" fill="rgba(16, 34, 68, 0.9)" stroke="#20d9ff"/>
    <line x1="34" y1="30" x2="52" y2="30" stroke="#ffffff" stroke-width="2"/>
    <line x1="34" y1="38" x2="62" y2="38" stroke="rgba(32, 217, 255, 0.6)" stroke-width="1.5"/>
    <!-- Envelope Body -->
    <rect x="20" y="38" width="60" height="42" rx="4" fill="rgba(7, 17, 31, 0.85)"/>
    <!-- Envelope folds -->
    <path d="M 20,38 L 50,60 L 80,38"/>
    <path d="M 20,80 L 42,56"/>
    <path d="M 80,80 L 58,56"/>
  </g>
  <!-- Heart / seal accent -->
  <circle cx="50" cy="59" r="4.5" fill="#20d9ff"/>
</svg>
