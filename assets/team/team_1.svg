<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="neon-stroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1683ff"/>
      <stop offset="100%" stop-color="#20d9ff"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#avatar-bg1)"/>
  
  <!-- Subtle circular grid -->
  <circle cx="150" cy="140" r="110" fill="none" stroke="rgba(32, 217, 255, 0.1)" stroke-width="1"/>
  <circle cx="150" cy="140" r="85" fill="none" stroke="rgba(22, 131, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Holographic silhouette -->
  <g fill="none" stroke="url(#neon-stroke1)" stroke-width="2.5" filter="url(#glow1)">
    <!-- Head -->
    <path d="M 150,75 C 168,75 182,90 182,110 C 182,126 172,138 158,143 C 150,146 142,146 134,143 C 122,138 118,126 118,110 C 118,90 132,75 150,75 Z" fill="rgba(32, 217, 255, 0.08)"/>
    <!-- Tech Visor / Glasses accent -->
    <path d="M 130,105 L 170,105" stroke="#20d9ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Torso / Shoulders -->
    <path d="M 90,230 C 90,185 118,170 150,170 C 182,170 210,185 210,230" fill="rgba(22, 131, 255, 0.06)"/>
    <!-- Cybernetic collar lines -->
    <path d="M 135,170 L 142,195 L 158,195 L 165,170" stroke-width="1.5"/>
  </g>
  
  <!-- Tech details -->
  <circle cx="150" cy="105" r="2" fill="#ffffff"/>
</svg>
