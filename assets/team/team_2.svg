<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#020610"/>
    </linearGradient>
    <linearGradient id="neon-stroke2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20d9ff"/>
      <stop offset="100%" stop-color="#45b6ff"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="24" fill="url(#avatar-bg2)"/>
  
  <!-- Subtle circular grid -->
  <circle cx="150" cy="140" r="110" fill="none" stroke="rgba(69, 182, 255, 0.1)" stroke-width="1"/>
  <polygon points="150,55 225,185 75,185" fill="none" stroke="rgba(32, 217, 255, 0.15)" stroke-width="1"/>
  
  <!-- Holographic silhouette -->
  <g fill="none" stroke="url(#neon-stroke2)" stroke-width="2.5" filter="url(#glow2)">
    <!-- Head & sleek creative style -->
    <path d="M 150,70 C 168,70 182,85 182,106 C 182,124 170,138 150,140 C 130,138 118,124 118,106 C 118,85 132,70 150,70 Z" fill="rgba(69, 182, 255, 0.08)"/>
    <!-- Headset / Creative icon -->
    <path d="M 112,105 C 112,85 125,75 150,75 C 175,75 188,85 188,105" stroke="#45b6ff" stroke-width="2"/>
    <rect x="108" y="98" width="8" height="18" rx="4" fill="#20d9ff"/>
    <rect x="184" y="98" width="8" height="18" rx="4" fill="#20d9ff"/>
    <!-- Torso / Shoulders -->
    <path d="M 95,230 C 95,185 120,168 150,168 C 180,168 205,185 205,230" fill="rgba(32, 217, 255, 0.06)"/>
    <!-- UI/UX layout crosshair -->
    <circle cx="150" cy="195" r="4" fill="#20d9ff"/>
    <line x1="140" y1="195" x2="160" y2="195" stroke="#20d9ff" stroke-width="1.5"/>
  </g>
</svg>
